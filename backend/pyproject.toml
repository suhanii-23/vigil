[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigil-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",   # file uploads
    "opencv-python-headless>=4.9",
    "ultralytics>=8.2",          # YOLOv8
    "lap>=0.5.12",               # linear assignment solver required by ByteTrack
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "anthropic>=0.28",
    "openai>=1.30",               # also used for OpenAI-compatible providers: Gemini, Grok
    "pillow>=10.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["."]
# yolov8n.pt lands in this directory at build time (ultralytics downloads it
# to the cwd) — exclude it so hatchling doesn't sweep the weight file into
# the wheel as if it were package source.
exclude = ["*.pt"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
